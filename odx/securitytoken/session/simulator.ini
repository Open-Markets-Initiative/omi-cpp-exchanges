# Runtime endpoints for the generated odx simulator (parsed at process start).
# Edit and restart to repoint connections; no regeneration required.

[order-entry]
host = 127.0.0.1
# no port of its own: each trader's gateway listens on the port below

# MakerBasic's gateway
[gateway-makerbasic]
port = 17111

# TakerBasic's gateway
[gateway-takerbasic]
port = 17112

# ItchTcp: the stream of the Itch feed a client logs in for
[replay-itchtcp]
host = 127.0.0.1
port = 17103

# gatewaymakerbasic -> sequencer: sequencer listens, gatewaymakerbasic dials it
[link-to_sequencer_gatewaymakerbasic]
host = 127.0.0.1
port = 19000

# gatewaytakerbasic -> sequencer: sequencer listens, gatewaytakerbasic dials it
[link-to_sequencer_gatewaytakerbasic]
host = 127.0.0.1
port = 19001

# day -> sequencer: sequencer listens, day dials it
[link-from_day]
host = 127.0.0.1
port = 19002

# sequencer -> engine: engine listens, sequencer dials it
[link-sequenced]
host = 127.0.0.1
port = 19003

# engine -> gatewaymakerbasic: gatewaymakerbasic listens, engine dials it
[link-to_clients_gatewaymakerbasic]
host = 127.0.0.1
port = 19004

# engine -> gatewaytakerbasic: gatewaytakerbasic listens, engine dials it
[link-to_clients_gatewaytakerbasic]
host = 127.0.0.1
port = 19005

# engine -> itch: itch listens, engine dials it
[link-to_itch]
host = 127.0.0.1
port = 19006

# itch -> itchtcp: itchtcp listens, itch dials it
[link-to_itchtcp]
host = 127.0.0.1
port = 19007

# gatewaymakerbasic -> makerbasic: makerbasic listens, gatewaymakerbasic dials it
[link-to_makerbasic]
host = 127.0.0.1
port = 19008

# makerbasic -> gatewaymakerbasic: gatewaymakerbasic listens, makerbasic dials it
[link-from_makerbasic]
host = 127.0.0.1
port = 19009

# gatewaytakerbasic -> takerbasic: takerbasic listens, gatewaytakerbasic dials it
[link-to_takerbasic]
host = 127.0.0.1
port = 19010

# takerbasic -> gatewaytakerbasic: gatewaytakerbasic listens, takerbasic dials it
[link-from_takerbasic]
host = 127.0.0.1
port = 19011

# The trading day a served venue runs: the seconds after it starts that each change of
# phase is asked for. The startup run asks for them between its turns instead.
[day]
start = 0
preopen = 2
nocancel = 25
open = 30
preclose = 35
nocancel-2 = 55
close = 60
end = 65

[recording]
directory = recordings

# How the venue keeps time, for what it stamps and when its day changes phase:
#   Elapsed       the [day] seconds after it starts, on a clock that never steps; stamps the wall clock
#   Wall          the same, on the wall clock, so stamps and declared times agree
#   SimulatedDay  the day starts at `start` in `zone` whenever the venue starts, at real speed
#   TimeOfDay     the day starts at `start` in `zone` today; started later, it catches up
# The [day] seconds count from the day's start in every mode.
[clock]
mode = Elapsed
start = 00:00:00
zone = UTC
