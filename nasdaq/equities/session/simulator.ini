# The trading day a served venue runs: the seconds after it starts that each change of
# phase is asked for. The startup run asks for them between its turns instead.
[day]
preopen = 0
halt-zxzzt = 0
openinglockin = 25
openinglockout = 28
openinglate = 29
open = 30
postpone-zxzzt = 45
halt-zwzzt = 60
resume-zwzzt = 85
quote-zxzzt = 90
resume-zxzzt = 110
halt = 120
quote = 140
resume = 150
preclose = 240
closinglockout = 265
closingfreeze = 268
close = 270
extendedtradingcloseend = 275
end = 300

[recording]
directory = recordings

# The engine's own book, said over the venue's Ipc when it is asked: a Book Request, put in order by the
# engine's sequencer as an order is, then a Book Order for each order the engine holds and a Book End, each
# naming the request's place in that order. dump: a file the engine also writes what it says to, none where
# empty - Engine.hpp says what a line is. every: phase, and the trading day asks after each change of phase
# it asks for; a number, and it asks every so many milliseconds of the day it serves, until its last change;
# none, and nothing asks unless something on the Ipc does.
[book]
dump =
every = none

# The venue's supervisor: the port its trading day reads one on, none where 0. A line
#   break <match> <reason>
# asks that a match be broken - its number as the venue told its fills - for one of the reasons its Ipc
# codes; the day answers asked, or why not, and the engine says the trade broken. break_trade.sh sends one.
[supervisor]
port = 0

# How the venue keeps time, for what it stamps and when its day changes phase:
#   Elapsed       the [day] seconds after it starts, on a clock that never steps; stamps the wall clock
#   Wall          the same, on the wall clock, so stamps and declared times agree
#   SimulatedDay  the day starts at `start` in `zone` whenever the venue starts, at real speed
#   TimeOfDay     the day starts at `start` in `zone` today; started later, it catches up
# The [day] seconds count from the day's start in every mode.
[clock]
mode = Elapsed
start = 00:00:00
zone = UTC
