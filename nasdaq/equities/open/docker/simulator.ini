# Runtime endpoints for the generated nasdaq simulator (parsed at process start).
# Edit and restart to repoint connections; no regeneration required.
#
# This is the copy an image runs with: order entry binds every interface, because the
# firm that dials it is on another machine. Nothing else differs from the one beside it.

[order-entry]
host = 0.0.0.0
# no port of its own: each trader's gateway listens on the port below

# MakerBasic's gateway
[gateway-makerbasic]
port = 15011

# TakerBasic's gateway
[gateway-takerbasic]
port = 15012

# Replay's gateway
[gateway-replay]
port = 15013

# Requests's gateway
[gateway-requests]
port = 15014

[feed-totalview]
group = 233.54.12.111
port = 26477

# Glimpse: the snapshot of the TotalView feed a client logs in for
[replay-glimpse]
port = 15002

# TotalViewTcp: the stream of the TotalView feed a client logs in for
[replay-totalviewtcp]
port = 15003

# gatewaymakerbasic -> sequencer: sequencer listens, gatewaymakerbasic dials it
[link-to_sequencer_gatewaymakerbasic]
host = sequencer
port = 19000

# gatewaytakerbasic -> sequencer: sequencer listens, gatewaytakerbasic dials it
[link-to_sequencer_gatewaytakerbasic]
host = sequencer
port = 19001

# gatewayreplay -> sequencer: sequencer listens, gatewayreplay dials it
[link-to_sequencer_gatewayreplay]
host = sequencer
port = 19002

# gatewayrequests -> sequencer: sequencer listens, gatewayrequests dials it
[link-to_sequencer_gatewayrequests]
host = sequencer
port = 19003

# sequencer -> engine: engine listens, sequencer dials it
[link-sequenced]
host = engine
port = 19004

# engine -> gatewaymakerbasic: gatewaymakerbasic listens, engine dials it
[link-to_clients_gatewaymakerbasic]
host = gatewaymakerbasic
port = 19005

# engine -> gatewaytakerbasic: gatewaytakerbasic listens, engine dials it
[link-to_clients_gatewaytakerbasic]
host = gatewaytakerbasic
port = 19006

# engine -> gatewayreplay: gatewayreplay listens, engine dials it
[link-to_clients_gatewayreplay]
host = gatewayreplay
port = 19007

# engine -> gatewayrequests: gatewayrequests listens, engine dials it
[link-to_clients_gatewayrequests]
host = gatewayrequests
port = 19008

# engine -> totalview: totalview listens, engine dials it
[link-to_totalview]
host = totalview
port = 19009

# totalview -> glimpse: glimpse listens, totalview dials it
[link-to_glimpse]
host = glimpse
port = 19010

# totalview -> totalviewtcp: totalviewtcp listens, totalview dials it
[link-to_totalviewtcp]
host = totalviewtcp
port = 19011

# gatewaymakerbasic -> makerbasic: makerbasic listens, gatewaymakerbasic dials it
[link-to_makerbasic]
host = makerbasic
port = 19012

# makerbasic -> gatewaymakerbasic: gatewaymakerbasic listens, makerbasic dials it
[link-from_makerbasic]
host = gatewaymakerbasic
port = 19013

# gatewaytakerbasic -> takerbasic: takerbasic listens, gatewaytakerbasic dials it
[link-to_takerbasic]
host = takerbasic
port = 19014

# takerbasic -> gatewaytakerbasic: gatewaytakerbasic listens, takerbasic dials it
[link-from_takerbasic]
host = gatewaytakerbasic
port = 19015

# gatewayreplay -> replay: replay listens, gatewayreplay dials it
[link-to_replay]
host = replay
port = 19016

# replay -> gatewayreplay: gatewayreplay listens, replay dials it
[link-from_replay]
host = gatewayreplay
port = 19017

# gatewayrequests -> requests: requests listens, gatewayrequests dials it
[link-to_requests]
host = requests
port = 19018

# requests -> gatewayrequests: gatewayrequests listens, requests dials it
[link-from_requests]
host = gatewayrequests
port = 19019

[recording]
directory = recordings
