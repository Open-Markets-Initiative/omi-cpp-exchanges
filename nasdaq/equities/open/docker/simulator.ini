# Runtime endpoints for the generated nasdaq simulator (parsed at process start).
# Edit and restart to repoint connections; no regeneration required.
#
# This is the copy an image runs with: order entry binds every interface, because the
# firm that dials it is on another machine. Nothing else differs from the one beside it.

[order-entry]
host = 0.0.0.0
port = 15001

[feed-totalview]
group = 233.54.12.111
port = 26477

# Glimpse: the snapshot of the TotalView feed a client logs in for
[replay-glimpse]
port = 15002

# TotalViewTcp: the stream of the TotalView feed a client logs in for
[replay-totalviewtcp]
port = 15003

# gateway -> engine: engine listens, gateway dials it
[link-to_engine]
host = engine
port = 19000

# engine -> gateway: gateway listens, engine dials it
[link-to_clients]
host = gateway
port = 19001

# engine -> totalview: totalview listens, engine dials it
[link-to_totalview]
host = totalview
port = 19002

# totalview -> glimpse: glimpse listens, totalview dials it
[link-to_glimpse]
host = glimpse
port = 19003

# totalview -> totalviewtcp: totalviewtcp listens, totalview dials it
[link-to_totalviewtcp]
host = totalviewtcp
port = 19004

# gateway -> maker: maker listens, gateway dials it
[link-to_maker]
host = maker
port = 19005

# maker -> gateway: gateway listens, maker dials it
[link-from_maker]
host = gateway
port = 19006

# gateway -> taker: taker listens, gateway dials it
[link-to_taker]
host = taker
port = 19007

# taker -> gateway: gateway listens, taker dials it
[link-from_taker]
host = gateway
port = 19008

# gateway -> replay: replay listens, gateway dials it
[link-to_replay]
host = replay
port = 19009

# replay -> gateway: gateway listens, replay dials it
[link-from_replay]
host = gateway
port = 19010

# gateway -> requests: requests listens, gateway dials it
[link-to_requests]
host = requests
port = 19011

# requests -> gateway: gateway listens, requests dials it
[link-from_requests]
host = gateway
port = 19012

[recording]
directory = recordings
