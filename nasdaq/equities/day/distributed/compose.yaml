# The Nasdaq Stock Market Day venue across containers: one per component, one image, one network.
#
# Generated from the venue's own declaration — the services are its components, the ports are
# the ones it serves on, and a link's host is the name of the service that reads it, which is
# what Docker's resolver turns into wherever that container is. Nothing here knows an address.
#
#   docker compose -f compose.yaml up --build
#   docker compose -f compose.yaml stop engine     # a tier fails
#   docker compose -f compose.yaml down

name: nasdaq-distributed

# What every component shares: the image, built once from the venue's own tree, and how it is
# stopped. SIGINT rather than SIGKILL because a component asked to stop drains what it is
# holding and says what it saw, and that is most of what a run is read from.
x-component: &component
    build:
        context: ..
        dockerfile: Dockerfile
    image: nasdaq-venue:latest
    init: true
    # The image's own CMD is the single binary's; a service names its component instead.
    command: []
    stop_signal: SIGINT
    stop_grace_period: 10s
    networks: [venue]

services:

    # MakerBasic's order entry: a gateway for each trader, each publishing a port of
    # its own to the host, their orders meeting only in the engine's sequencer.
    gatewaymakerbasic:
        <<: *component
        entrypoint: ["./nasdaq_distributed_gatewaymakerbasic"]
        labels:
            nasdaq.tier: "entry"
        ports:
            - "15111:15111"   # MakerBasic's order entry

    # TakerBasic's order entry: a gateway for each trader, each publishing a port of
    # its own to the host, their orders meeting only in the engine's sequencer.
    gatewaytakerbasic:
        <<: *component
        entrypoint: ["./nasdaq_distributed_gatewaytakerbasic"]
        labels:
            nasdaq.tier: "entry"
        ports:
            - "15112:15112"   # TakerBasic's order entry

    # Replay's order entry: a gateway for each trader, each publishing a port of
    # its own to the host, their orders meeting only in the engine's sequencer.
    gatewayreplay:
        <<: *component
        entrypoint: ["./nasdaq_distributed_gatewayreplay"]
        labels:
            nasdaq.tier: "entry"
        ports:
            - "15113:15113"   # Replay's order entry

    # Requests's order entry: a gateway for each trader, each publishing a port of
    # its own to the host, their orders meeting only in the engine's sequencer.
    gatewayrequests:
        <<: *component
        entrypoint: ["./nasdaq_distributed_gatewayrequests"]
        labels:
            nasdaq.tier: "entry"
        ports:
            - "15114:15114"   # Requests's order entry

    # The book, on its own: what the venue matches should fail by itself.
    engine:
        <<: *component
        entrypoint: ["./nasdaq_distributed_engine"]
        labels:
            nasdaq.tier: "matching"

    # The sequencer of engine: everything bound for it, from every gateway and the day, put in
    # one order and stamped. It sits beside its engine, and keeps no book.
    sequencer:
        <<: *component
        entrypoint: ["./nasdaq_distributed_sequencer"]
        labels:
            nasdaq.tier: "matching"

    # The trading day: it asks the engine for each change of phase on the clock, and what the
    # auction collecting would cross at. It keeps no book and serves no one outside.
    day:
        <<: *component
        entrypoint: ["./nasdaq_distributed_day"]
        labels:
            nasdaq.tier: "day"

    # The TotalView feed: engine events through its transforms and out as multicast on
    # 233.54.12.112:26478, which a bridged network does not carry between hosts — a client
    # elsewhere takes the stream off the recovery tier instead.
    totalview:
        <<: *component
        entrypoint: ["./nasdaq_distributed_totalview"]
        labels:
            nasdaq.tier: "data"

    # Recovery: the snapshot of TotalView. A client that has missed something asks
    # here rather than asking the component that was busy losing it.
    glimpse:
        <<: *component
        entrypoint: ["./nasdaq_distributed_glimpse"]
        labels:
            nasdaq.tier: "recovery"
        ports:
            - "15102:15102"   # Glimpse, over Tcp

    # Recovery: the stream of TotalView. A client that has missed something asks
    # here rather than asking the component that was busy losing it.
    totalviewtcp:
        <<: *component
        entrypoint: ["./nasdaq_distributed_totalviewtcp"]
        labels:
            nasdaq.tier: "recovery"
        ports:
            - "15103:15103"   # TotalViewTcp, over Tcp

    # A trader of the venue's own: MakerBasic, a makerbasic. It reaches the gateway over a link
    # like any other component, rather than dialling order entry as an outside firm would.
    makerbasic:
        <<: *component
        entrypoint: ["./nasdaq_distributed_makerbasic"]
        labels:
            nasdaq.tier: "clients"

    # A trader of the venue's own: TakerBasic, a takerbasic. It reaches the gateway over a link
    # like any other component, rather than dialling order entry as an outside firm would.
    takerbasic:
        <<: *component
        entrypoint: ["./nasdaq_distributed_takerbasic"]
        labels:
            nasdaq.tier: "clients"

    # A trader of the venue's own: Replay, a capture. It reaches the gateway over a link
    # like any other component, rather than dialling order entry as an outside firm would.
    replay:
        <<: *component
        entrypoint: ["./nasdaq_distributed_replay"]
        labels:
            nasdaq.tier: "clients"

    # A trader of the venue's own: Requests, a capture. It reaches the gateway over a link
    # like any other component, rather than dialling order entry as an outside firm would.
    requests:
        <<: *component
        entrypoint: ["./nasdaq_distributed_requests"]
        labels:
            nasdaq.tier: "clients"

networks:
    # A network of their own, so the only thing a component can reach is another component.
    venue:
        driver: bridge
