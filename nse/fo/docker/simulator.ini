# Runtime endpoints for the generated nse simulator (parsed at process start).
# Edit and restart to repoint connections; no regeneration required.
#
# This is the copy an image runs with: order entry binds every interface, because the
# firm that dials it is on another machine. Nothing else differs from the one beside it.

[order-entry]
host = 0.0.0.0
port = 10900

[feed-mtbt]
group = 239.70.70.61
port = 17761

# gateway -> engine: engine listens, gateway dials it
[link-to_engine]
host = engine
port = 19000

# engine -> gateway: gateway listens, engine dials it
[link-to_clients]
host = gateway
port = 19001

# engine -> mtbt: mtbt listens, engine dials it
[link-to_mtbt]
host = mtbt
port = 19002

# gateway -> makerbasic: makerbasic listens, gateway dials it
[link-to_makerbasic]
host = makerbasic
port = 19003

# makerbasic -> gateway: gateway listens, makerbasic dials it
[link-from_makerbasic]
host = gateway
port = 19004

# gateway -> takerbasic: takerbasic listens, gateway dials it
[link-to_takerbasic]
host = takerbasic
port = 19005

# takerbasic -> gateway: gateway listens, takerbasic dials it
[link-from_takerbasic]
host = gateway
port = 19006

[recording]
directory = recordings

# How the venue keeps time, for what it stamps and when its day changes phase:
#   Elapsed       the [day] seconds after it starts, on a clock that never steps; stamps the wall clock
#   Wall          the same, on the wall clock, so stamps and declared times agree
#   SimulatedDay  the day starts at `start` in `zone` whenever the venue starts, at real speed
#   TimeOfDay     the day starts at `start` in `zone` today; started later, it catches up
# The [day] seconds count from the day's start in every mode.
[clock]
mode = Elapsed
start = 00:00:00
zone = UTC
