name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Update Operating System
        run: sudo apt-get update

      - name: Install Dependencies
        run: sudo apt-get install -y cmake g++ libboost-all-dev

      - name: Configure Investors Exchange Equities Simulator
        run: cmake -S iex/equities -B build/iex/equities -DCMAKE_BUILD_TYPE=Release

      - name: Build Investors Exchange Equities Simulator
        run: cmake --build build/iex/equities --parallel $(nproc)

      - name: Test Investors Exchange Equities Simulator
        run: ./build/iex/equities/simulator_tests

      - name: Run Investors Exchange Equities Simulator
        working-directory: iex/equities
        run: ../../build/iex/equities/iex_simulator

      - name: Test Investors Exchange Equities Connections
        working-directory: iex/equities
        env:
          IEX_SIMULATOR: ../../build/iex/equities/iex_simulator
        run: python3 common/tests/Connections.py
