name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Update Operating System
        run: sudo apt-get update

      - name: Install Dependencies
        run: sudo apt-get install -y cmake g++ libboost-all-dev g++-14 tzdata

      - name: Configure Investors Exchange Equities Open Simulator
        run: cmake -S iex/equities/open -B build/iex/equities/open -DCMAKE_BUILD_TYPE=Release

      - name: Build Investors Exchange Equities Open Simulator
        run: cmake --build build/iex/equities/open --parallel $(nproc)

      - name: Test Investors Exchange Equities Open Simulator
        run: ./build/iex/equities/open/simulator_tests

      - name: Run Investors Exchange Equities Open Simulator
        working-directory: iex/equities/open
        run: ../../../build/iex/equities/open/iex_simulator

      - name: Verify Investors Exchange Equities Open Components (system)
        working-directory: iex/equities/open/system
        run: bash verify.sh ../../../../build/iex/equities/open 8

      - name: Verify Investors Exchange Equities Open Components (distributed)
        working-directory: iex/equities/open/distributed
        run: bash verify.sh ../../../../build/iex/equities/open 8

      - name: Test Investors Exchange Equities Open Connections
        working-directory: iex/equities/open
        env:
          IEX_SIMULATOR: ../../../build/iex/equities/open/iex_simulator
        run: python3 common/tests/Connections.py

      - name: Configure Investors Exchange Equities Session Simulator
        run: cmake -S iex/equities/session -B build/iex/equities/session -DCMAKE_BUILD_TYPE=Release

      - name: Build Investors Exchange Equities Session Simulator
        run: cmake --build build/iex/equities/session --parallel $(nproc)

      - name: Test Investors Exchange Equities Session Simulator
        run: ./build/iex/equities/session/simulator_tests

      - name: Run Investors Exchange Equities Session Simulator
        working-directory: iex/equities/session
        run: ../../../build/iex/equities/session/iex_simulator

      - name: Verify Investors Exchange Equities Session Components (system)
        working-directory: iex/equities/session/system
        run: bash verify.sh ../../../../build/iex/equities/session 8

      - name: Verify Investors Exchange Equities Session Components (distributed)
        working-directory: iex/equities/session/distributed
        run: bash verify.sh ../../../../build/iex/equities/session 8

      - name: Test Investors Exchange Equities Session Connections
        working-directory: iex/equities/session
        env:
          IEX_SIMULATOR: ../../../build/iex/equities/session/iex_simulator
        run: python3 common/tests/Connections.py

      - name: Configure Nse Futures and Options Simulator
        run: cmake -S nse/fo -B build/nse/fo -DCMAKE_BUILD_TYPE=Release

      - name: Build Nse Futures and Options Simulator
        run: cmake --build build/nse/fo --parallel $(nproc)

      - name: Test Nse Futures and Options Simulator
        run: ./build/nse/fo/simulator_tests

      - name: Run Nse Futures and Options Simulator
        working-directory: nse/fo
        run: ../../build/nse/fo/nse_simulator

      - name: Verify Nse Futures and Options Components (system)
        working-directory: nse/fo/system
        run: bash verify.sh ../../../build/nse/fo 8

      - name: Verify Nse Futures and Options Components (distributed)
        working-directory: nse/fo/distributed
        run: bash verify.sh ../../../build/nse/fo 8

      - name: Configure Nasdaq Stock Market Open Simulator
        run: cmake -S nasdaq/equities/open -B build/nasdaq/equities/open -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14

      - name: Build Nasdaq Stock Market Open Simulator
        run: cmake --build build/nasdaq/equities/open --parallel $(nproc)

      - name: Test Nasdaq Stock Market Open Simulator
        run: ./build/nasdaq/equities/open/simulator_tests

      - name: Run Nasdaq Stock Market Open Simulator
        working-directory: nasdaq/equities/open
        run: ../../../build/nasdaq/equities/open/nasdaq_simulator

      - name: Verify Nasdaq Stock Market Open Components (system)
        working-directory: nasdaq/equities/open/system
        run: bash verify.sh ../../../../build/nasdaq/equities/open 8

      - name: Verify Nasdaq Stock Market Open Components (distributed)
        working-directory: nasdaq/equities/open/distributed
        run: bash verify.sh ../../../../build/nasdaq/equities/open 8

      - name: Configure Nasdaq Stock Market Session Simulator
        run: cmake -S nasdaq/equities/session -B build/nasdaq/equities/session -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14

      - name: Build Nasdaq Stock Market Session Simulator
        run: cmake --build build/nasdaq/equities/session --parallel $(nproc)

      - name: Test Nasdaq Stock Market Session Simulator
        run: ./build/nasdaq/equities/session/simulator_tests

      - name: Run Nasdaq Stock Market Session Simulator
        working-directory: nasdaq/equities/session
        run: ../../../build/nasdaq/equities/session/nasdaq_simulator

      - name: Verify Nasdaq Stock Market Session Components (system)
        working-directory: nasdaq/equities/session/system
        run: bash verify.sh ../../../../build/nasdaq/equities/session 8

      - name: Verify Nasdaq Stock Market Session Components (distributed)
        working-directory: nasdaq/equities/session/distributed
        run: bash verify.sh ../../../../build/nasdaq/equities/session 8
