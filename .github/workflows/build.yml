name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Update Operating System
        run: sudo apt-get update

      - name: Install Dependencies
        run: sudo apt-get install -y cmake g++ libboost-all-dev g++-14 tzdata

      - name: Configure Investors Exchange Equities Open Simulator
        run: cmake -S iex/equities/open -B build/iex/equities/open -DCMAKE_BUILD_TYPE=Release

      - name: Build Investors Exchange Equities Open Simulator
        run: cmake --build build/iex/equities/open --parallel $(nproc)

      - name: Test Investors Exchange Equities Open Simulator
        run: ./build/iex/equities/open/simulator_tests

      - name: Run Investors Exchange Equities Open Simulator
        working-directory: iex/equities/open
        run: ../../../build/iex/equities/open/iex_simulator

      - name: Verify Investors Exchange Equities Open Components (system)
        working-directory: iex/equities/open/system
        run: bash verify.sh ../../../../build/iex/equities/open 8

      - name: Verify Investors Exchange Equities Open Components (distributed)
        working-directory: iex/equities/open/distributed
        run: bash verify.sh ../../../../build/iex/equities/open 8

      - name: Test Investors Exchange Equities Open Connections
        working-directory: iex/equities/open
        env:
          IEX_SIMULATOR: ../../../build/iex/equities/open/iex_simulator
        run: python3 common/tests/Connections.py

      - name: Configure Investors Exchange Equities Session Simulator
        run: cmake -S iex/equities/session -B build/iex/equities/session -DCMAKE_BUILD_TYPE=Release

      - name: Build Investors Exchange Equities Session Simulator
        run: cmake --build build/iex/equities/session --parallel $(nproc)

      - name: Test Investors Exchange Equities Session Simulator
        run: ./build/iex/equities/session/simulator_tests

      - name: Run Investors Exchange Equities Session Simulator
        working-directory: iex/equities/session
        run: ../../../build/iex/equities/session/iex_simulator

      - name: Verify Investors Exchange Equities Session Components (system)
        working-directory: iex/equities/session/system
        run: bash verify.sh ../../../../build/iex/equities/session 8

      - name: Verify Investors Exchange Equities Session Components (distributed)
        working-directory: iex/equities/session/distributed
        run: bash verify.sh ../../../../build/iex/equities/session 8

      - name: Test Investors Exchange Equities Session Connections
        working-directory: iex/equities/session
        env:
          IEX_SIMULATOR: ../../../build/iex/equities/session/iex_simulator
        run: python3 common/tests/Connections.py

      - name: Configure Nse Futures and Options Simulator
        run: cmake -S nse/fo -B build/nse/fo -DCMAKE_BUILD_TYPE=Release

      - name: Build Nse Futures and Options Simulator
        run: cmake --build build/nse/fo --parallel $(nproc)

      - name: Test Nse Futures and Options Simulator
        run: ./build/nse/fo/simulator_tests

      - name: Run Nse Futures and Options Simulator
        working-directory: nse/fo
        run: ../../build/nse/fo/nse_simulator

      - name: Verify Nse Futures and Options Components (system)
        working-directory: nse/fo/system
        run: bash verify.sh ../../../build/nse/fo 8

      - name: Verify Nse Futures and Options Components (distributed)
        working-directory: nse/fo/distributed
        run: bash verify.sh ../../../build/nse/fo 8

      - name: Configure Odx Equities Open Simulator
        run: cmake -S odx/equities/open -B build/odx/equities/open -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14

      - name: Build Odx Equities Open Simulator
        run: cmake --build build/odx/equities/open --parallel $(nproc)

      - name: Test Odx Equities Open Simulator
        run: ./build/odx/equities/open/simulator_tests

      - name: Run Odx Equities Open Simulator
        working-directory: odx/equities/open
        run: ../../../build/odx/equities/open/odx_simulator

      - name: Verify Odx Equities Open Components (system)
        working-directory: odx/equities/open/system
        run: bash verify.sh ../../../../build/odx/equities/open 8

      - name: Verify Odx Equities Open Components (distributed)
        working-directory: odx/equities/open/distributed
        run: bash verify.sh ../../../../build/odx/equities/open 8

      - name: Configure Odx Equities Session Simulator
        run: cmake -S odx/equities/session -B build/odx/equities/session -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14

      - name: Build Odx Equities Session Simulator
        run: cmake --build build/odx/equities/session --parallel $(nproc)

      - name: Test Odx Equities Session Simulator
        run: ./build/odx/equities/session/simulator_tests

      - name: Run Odx Equities Session Simulator
        working-directory: odx/equities/session
        run: ../../../build/odx/equities/session/odx_simulator

      - name: Verify Odx Equities Session Components (system)
        working-directory: odx/equities/session/system
        run: bash verify.sh ../../../../build/odx/equities/session 8

      - name: Verify Odx Equities Session Components (distributed)
        working-directory: odx/equities/session/distributed
        run: bash verify.sh ../../../../build/odx/equities/session 8

      - name: Configure Odx Security Token Open Simulator
        run: cmake -S odx/securitytoken/open -B build/odx/securitytoken/open -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14

      - name: Build Odx Security Token Open Simulator
        run: cmake --build build/odx/securitytoken/open --parallel $(nproc)

      - name: Test Odx Security Token Open Simulator
        run: ./build/odx/securitytoken/open/simulator_tests

      - name: Run Odx Security Token Open Simulator
        working-directory: odx/securitytoken/open
        run: ../../../build/odx/securitytoken/open/odx_simulator

      - name: Verify Odx Security Token Open Components (system)
        working-directory: odx/securitytoken/open/system
        run: bash verify.sh ../../../../build/odx/securitytoken/open 8

      - name: Verify Odx Security Token Open Components (distributed)
        working-directory: odx/securitytoken/open/distributed
        run: bash verify.sh ../../../../build/odx/securitytoken/open 8

      - name: Test Odx Security Token Open Connections
        working-directory: odx/securitytoken/open
        env:
          ODX_SIMULATOR: ../../../build/odx/securitytoken/open/odx_simulator
        run: python3 common/tests/Connections.py

      - name: Configure Odx Security Token Session Simulator
        run: cmake -S odx/securitytoken/session -B build/odx/securitytoken/session -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14

      - name: Build Odx Security Token Session Simulator
        run: cmake --build build/odx/securitytoken/session --parallel $(nproc)

      - name: Test Odx Security Token Session Simulator
        run: ./build/odx/securitytoken/session/simulator_tests

      - name: Run Odx Security Token Session Simulator
        working-directory: odx/securitytoken/session
        run: ../../../build/odx/securitytoken/session/odx_simulator

      - name: Verify Odx Security Token Session Components (system)
        working-directory: odx/securitytoken/session/system
        run: bash verify.sh ../../../../build/odx/securitytoken/session 8

      - name: Verify Odx Security Token Session Components (distributed)
        working-directory: odx/securitytoken/session/distributed
        run: bash verify.sh ../../../../build/odx/securitytoken/session 8

      - name: Test Odx Security Token Session Connections
        working-directory: odx/securitytoken/session
        env:
          ODX_SIMULATOR: ../../../build/odx/securitytoken/session/odx_simulator
        run: python3 common/tests/Connections.py
